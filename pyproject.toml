[project]
name = "pov-marbleracer"
version = "0.2.0"
description = "Physically grounded Panda3D marble-on-ramp simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "panda3d>=1.10",
  "panda3d-gltf>=1.3",
  "panda3d-simplepbr>=0.13",
]

[project.optional-dependencies]
train = [
  "gymnasium>=1.2",
  "stable-baselines3>=2.8",
  "torch>=2.11",
]

[project.scripts]
marbleracer = "marbleracer.main:main"
marbleracer-builder = "marbleracer.builder:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marbleracer = ["data/*.json", "data/*.npz", "data/*.md"]
