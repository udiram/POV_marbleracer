[project]
name = "pov-marbleracer"
version = "0.2.0"
description = "Physically grounded Panda3D marble-on-ramp simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "panda3d>=1.10",
  "panda3d-gltf>=1.3",
  "panda3d-simplepbr>=0.13",
]

[project.scripts]
marbleracer = "marbleracer.main:main"
marbleracer-builder = "marbleracer.builder:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
