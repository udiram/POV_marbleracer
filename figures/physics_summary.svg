<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900"><defs><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#d6cebf" flood-opacity="0.35"/></filter><linearGradient id="heroWash" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f8f4ec"/><stop offset="100%" stop-color="#efe7db"/></linearGradient><linearGradient id="trackFade" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a9d2db" stop-opacity="0.35"/><stop offset="100%" stop-color="#1b6b84" stop-opacity="0.20"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#heroWash)"/><circle cx="1190" cy="120" r="160" fill="#efe5d4" opacity="0.55"/><circle cx="130" cy="790" r="200" fill="#f1e7d8" opacity="0.45"/><text x="64.00" y="60.00" fill="#1c2228" font-size="22" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="650" text-anchor="start">Figure 3. Physics tuning summary</text><text x="64.00" y="84.00" fill="#6d7782" font-size="13" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">The project combines physically motivated limits with deliberately game-tuned response values.</text><rect x="62.00" y="132.00" width="820.00" height="676.00" fill="#fffdf9" stroke="#d9d2c7" stroke-width="1.5" rx="24.00" filter="url(#softShadow)"/><text x="88.00" y="172.00" fill="#1c2228" font-size="22" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="650" text-anchor="start">SimulationConfig comparison</text><text x="88.00" y="196.00" fill="#6d7782" font-size="13" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Bars share a common scale so the deliberately tiny restitution remains visually obvious.</text><text x="88.00" y="239.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Static friction threshold</text><rect x="358.00" y="222.00" width="484.00" height="24.00" fill="#f1ece3" stroke="none" stroke-width="0.0" rx="12.00"/><rect x="358.00" y="222.00" width="10.59" height="24.00" fill="#314c73" stroke="none" stroke-width="0.0" rx="12.00"/><text x="856.00" y="240.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="end">0.085</text><text x="88.00" y="297.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Configured static friction</text><rect x="358.00" y="280.00" width="484.00" height="24.00" fill="#f1ece3" stroke="none" stroke-width="0.0" rx="12.00"/><rect x="358.00" y="280.00" width="40.00" height="24.00" fill="#2a9d8f" stroke="none" stroke-width="0.0" rx="12.00"/><text x="856.00" y="298.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="end">0.320</text><text x="88.00" y="355.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Ramp friction</text><rect x="358.00" y="338.00" width="484.00" height="24.00" fill="#f1ece3" stroke="none" stroke-width="0.0" rx="12.00"/><rect x="358.00" y="338.00" width="147.50" height="24.00" fill="#1b6b84" stroke="none" stroke-width="0.0" rx="12.00"/><text x="856.00" y="356.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="end">1.18</text><text x="88.00" y="413.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Marble friction</text><rect x="358.00" y="396.00" width="484.00" height="24.00" fill="#f1ece3" stroke="none" stroke-width="0.0" rx="12.00"/><rect x="358.00" y="396.00" width="131.25" height="24.00" fill="#5c7cfa" stroke="none" stroke-width="0.0" rx="12.00"/><text x="856.00" y="414.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="end">1.05</text><text x="88.00" y="471.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Rail friction</text><rect x="358.00" y="454.00" width="484.00" height="24.00" fill="#f1ece3" stroke="none" stroke-width="0.0" rx="12.00"/><rect x="358.00" y="454.00" width="112.50" height="24.00" fill="#8d99ae" stroke="none" stroke-width="0.0" rx="12.00"/><text x="856.00" y="472.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="end">0.900</text><text x="88.00" y="529.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Obstacle friction</text><rect x="358.00" y="512.00" width="484.00" height="24.00" fill="#f1ece3" stroke="none" stroke-width="0.0" rx="12.00"/><rect x="358.00" y="512.00" width="106.25" height="24.00" fill="#e76f51" stroke="none" stroke-width="0.0" rx="12.00"/><text x="856.00" y="530.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="end">0.850</text><text x="88.00" y="587.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Restitution</text><rect x="358.00" y="570.00" width="484.00" height="24.00" fill="#f1ece3" stroke="none" stroke-width="0.0" rx="12.00"/><rect x="358.00" y="570.00" width="2.50" height="24.00" fill="#b56576" stroke="none" stroke-width="0.0" rx="12.00"/><text x="856.00" y="588.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="end">0.020</text><text x="88.00" y="645.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Brake drag</text><rect x="358.00" y="628.00" width="484.00" height="24.00" fill="#f1ece3" stroke="none" stroke-width="0.0" rx="12.00"/><rect x="358.00" y="628.00" width="150.00" height="24.00" fill="#6d597a" stroke="none" stroke-width="0.0" rx="12.00"/><text x="856.00" y="646.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="end">1.20</text><text x="88.00" y="703.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Steering accel</text><rect x="358.00" y="686.00" width="484.00" height="24.00" fill="#f1ece3" stroke="none" stroke-width="0.0" rx="12.00"/><rect x="358.00" y="686.00" width="500.00" height="24.00" fill="#355070" stroke="none" stroke-width="0.0" rx="12.00"/><text x="856.00" y="704.00" fill="#1c2228" font-size="15" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="end">4.00</text><rect x="920.00" y="132.00" width="336.00" height="280.00" fill="#fffdf9" stroke="#d9d2c7" stroke-width="1.5" rx="24.00" filter="url(#softShadow)"/><text x="944.00" y="174.00" fill="#1c2228" font-size="22" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="650" text-anchor="start">Pure-rolling check</text><text x="944.00" y="198.00" fill="#6d7782" font-size="13" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">The static friction threshold is computed from the incline angle.</text><text x="944.00" y="244.00" fill="#1c2228" font-size="26" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="650" text-anchor="start">μs,req = (2/7) tan(θ)</text><text x="944.00" y="286.00" fill="#1c2228" font-size="17" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">θ = 16.52°</text><text x="944.00" y="314.00" fill="#1c2228" font-size="17" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">μs,req = 0.085</text><text x="944.00" y="342.00" fill="#1c2228" font-size="17" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">configured μs = 0.320</text><rect x="942.00" y="364.00" width="178.00" height="30.00" fill="#2a9d8f" stroke="none" stroke-width="0.0" rx="15.00" opacity="0.16"/><text x="960.00" y="384.00" fill="#2a9d8f" font-size="16" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">Rolling supported</text><rect x="920.00" y="444.00" width="336.00" height="364.00" fill="#fffdf9" stroke="#d9d2c7" stroke-width="1.5" rx="24.00" filter="url(#softShadow)"/><text x="944.00" y="486.00" fill="#1c2228" font-size="22" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="650" text-anchor="start">What matters in play</text><text x="944.00" y="510.00" fill="#6d7782" font-size="13" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">These choices are consistent with the</text><text x="944.00" y="526.00" fill="#6d7782" font-size="13" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">report's simulation-versus-arcade</text><text x="944.00" y="542.00" fill="#6d7782" font-size="13" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">framing.</text><circle cx="950.00" cy="557.00" r="4.50" fill="#314c73" stroke="none" stroke-width="0.0"/><text x="964.00" y="562.00" fill="#1c2228" font-size="14" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Low restitution keeps impacts</text><text x="964.00" y="580.00" fill="#1c2228" font-size="14" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">from feeling pinball-like.</text><circle cx="950.00" cy="619.00" r="4.50" fill="#314c73" stroke="none" stroke-width="0.0"/><text x="964.00" y="624.00" fill="#1c2228" font-size="14" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Brake drag is exponential</text><text x="964.00" y="642.00" fill="#1c2228" font-size="14" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">rather than a hard velocity</text><text x="964.00" y="660.00" fill="#1c2228" font-size="14" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">clamp.</text><circle cx="950.00" cy="681.00" r="4.50" fill="#314c73" stroke="none" stroke-width="0.0"/><text x="964.00" y="686.00" fill="#1c2228" font-size="14" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Steering is a lateral force,</text><text x="964.00" y="704.00" fill="#1c2228" font-size="14" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">not a yaw rotation hack.</text><circle cx="950.00" cy="743.00" r="4.50" fill="#314c73" stroke="none" stroke-width="0.0"/><text x="964.00" y="748.00" fill="#1c2228" font-size="14" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Ramp and marble friction</text><text x="964.00" y="766.00" fill="#1c2228" font-size="14" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">exceed the pure-rolling</text><text x="964.00" y="784.00" fill="#1c2228" font-size="14" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">threshold.</text></svg>
